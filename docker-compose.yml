services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  # QuickInsights' own metadata database (connections, reports, schedules, SQL
  # examples, training state) — separate from any user database the app
  # connects to for querying. MariaDB 10.6 LTS: the minimum version Frappe
  # v14/v15 recommend, and it upgrades cleanly to 10.11/11.x LTS later, so a
  # single Frappe-compatible engine/driver (pymysql) covers both this store
  # and the databases the app connects to.
  # Only started when explicitly requested (`docker compose --profile docker-db
  # up -d`, or via ./setup_metadata_db.sh) — not part of a plain `docker
  # compose up -d`, so integrating into an existing Frappe bench (reusing
  # its MariaDB server instead of running a second one) doesn't spin this up
  # by accident.
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    profiles: ["docker-db"]
    environment:
      MARIADB_ROOT_PASSWORD: ${METADATA_DB_ROOT_PASSWORD:-quickinsights_root}
      MARIADB_DATABASE: ${METADATA_DB_NAME:-quickinsights}
      MARIADB_USER: ${METADATA_DB_USER:-quickinsights}
      MARIADB_PASSWORD: ${METADATA_DB_PASSWORD:-quickinsights}
    ports:
      - "${METADATA_DB_PORT:-3307}:3306"
    volumes:
      - ./mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
